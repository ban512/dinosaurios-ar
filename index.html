<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Mi primera experiencia AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #aviso {
      position: fixed; top: 12px; left: 12px; right: 12px;
      z-index: 10; padding: 10px; border-radius: 8px;
      background: #153451; color: white;
      font: 16px Arial, sans-serif; text-align: center;
      pointer-events: none;
      transition: opacity .3s;
    }
    #aviso.oculto { opacity: 0; }
    #aviso.error { background: #9b1c1c; }
    #girar {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      z-index: 10; display: none;
      padding: 14px 28px; border: none; border-radius: 30px;
      background: #1A7F86; color: white;
      font: bold 18px Arial, sans-serif;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .35);
    }
    #girar.activo { background: #9b1c1c; }
    #girar.visible { display: block; }
  </style>
</head>
<body>
  <div id="aviso">Autoriza la cámara y apunta a una de las tarjetas: dinosaurio, escudo o gorila</div>
  <button id="girar" type="button">Girar 360°</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets timeout="30000">
      <!-- Modelos 3D optimizados -->
      <a-asset-item id="dino" src="./dinosaurio.glb"></a-asset-item>
      <a-asset-item id="escudo" src="./escudo.glb"></a-asset-item>
      <a-asset-item id="gorila" src="./gorila.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0"
              look-controls="enabled: false"></a-camera>

    <!-- Luces para que el modelo no se vea oscuro -->
    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" intensity="1.5" position="1 2 3"></a-light>

    <!-- Cada modelo va dentro de una entidad "giro": el botón la hace dar vueltas sobre su propio eje.
         La tarjeta mide 1 de ancho: ajusta scale para hacer el modelo más grande o más chico -->

    <!-- targetIndex 0 = marcador.png (dinosaurio) -->
    <a-entity id="target-dino" mindar-image-target="targetIndex: 0">
      <a-entity class="giro" position="0 -0.3 0.05">
        <a-gltf-model src="#dino" rotation="10 -40 0" scale="0.75 0.75 0.75"></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- targetIndex 1 = marcador-escudo.png (escudo de hueso) -->
    <a-entity id="target-escudo" mindar-image-target="targetIndex: 1">
      <a-entity class="giro" position="0 -0.49 0.08">
        <a-gltf-model src="#escudo" rotation="0 -20 0" scale="0.76 0.76 0.76"></a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- targetIndex 2 = marcador-gorila.png (gorila) -->
    <a-entity id="target-gorila" mindar-image-target="targetIndex: 2">
      <a-entity class="giro" position="0 -0.49 0.08">
        <a-gltf-model src="#gorila" rotation="0 -30 0" scale="0.82 0.82 0.82"></a-gltf-model>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const aviso = document.getElementById('aviso');
    const boton = document.getElementById('girar');
    const escena = document.querySelector('a-scene');
    const targets = document.querySelectorAll('[mindar-image-target]');
    const giros = document.querySelectorAll('.giro');
    let visibles = 0;
    let girando = false;

    // Botón: empieza o detiene el giro de 360° (una vuelta cada 4 segundos)
    boton.addEventListener('click', () => {
      girando = !girando;
      giros.forEach((g) => {
        if (girando) {
          const y = g.object3D.rotation.y * 180 / Math.PI;
          g.setAttribute('animation__giro', {
            property: 'rotation', from: `0 ${y} 0`, to: `0 ${y + 360} 0`,
            dur: 4000, easing: 'linear', loop: true
          });
        } else {
          g.removeAttribute('animation__giro');
        }
      });
      boton.textContent = girando ? 'Detener giro' : 'Girar 360°';
      boton.classList.toggle('activo', girando);
    });

    escena.addEventListener('arReady', () => {
      aviso.textContent = 'Apunta la cámara a una de las tarjetas';
    });
    escena.addEventListener('arError', () => {
      aviso.classList.add('error');
      aviso.classList.remove('oculto');
      aviso.textContent = 'No se pudo abrir la cámara. Revisa los permisos y abre la página con https.';
    });

    // Oculta el aviso y muestra el botón mientras se vea algún target
    targets.forEach((target) => {
      target.addEventListener('targetFound', () => {
        visibles++;
        aviso.classList.add('oculto');
        boton.classList.add('visible');
      });
      target.addEventListener('targetLost', () => {
        visibles = Math.max(0, visibles - 1);
        if (visibles === 0) {
          aviso.textContent = 'Target perdido: vuelve a apuntar la cámara';
          aviso.classList.remove('oculto');
          boton.classList.remove('visible');
        }
      });
    });
  </script>
</body>
</html>
